<div class="modal-card">
  <button id="close-modal-btn" class="close-btn">&times;</button>

  <h2>Welcome Back</h2>
  <p class="subtitle">Enter your credentials to access your ideas dashboard</p>

  <form id="popupLoginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input
        type="email"
        id="login-email"
        class="form-control"
        placeholder="Enter your email.."
        required
      />
    </div>

    <div class="form-group" style="position: relative; margin-bottom: 15px">
      <label
        for="login-password"
        style="
          font-weight: bold;
          font-size: 13px;
          display: block;
          margin-bottom: 5px;
        "
        >Password</label
      >
      <input
        type="password"
        id="login-password"
        placeholder="Enter your password"
        required
        style="
          width: 100%;
          padding: 10px;
          padding-right: 40px;
          border: 1px solid #cbd5e1;
          border-radius: 6px;
          box-sizing: border-box;
        "
      />
      <i
        class="fa-solid fa-eye toggle-password"
        data-target="login-password"
        style="
          position: absolute;
          right: 12px;
          top: 38px;
          cursor: pointer;
          color: #64748b;
        "
      ></i>
    </div>

    <button type="submit" class="btn-primary">Sign In</button>
  </form>

  <p class="switch-auth">
    Don't have an account? <a href="home.html" id="go-to-signup">Sign up</a>
  </p>
</div>
