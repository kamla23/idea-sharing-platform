<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Ideas - MindMeld</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="footer.css" />
    <link rel="stylesheet" href="explore.css" />
    <link rel="stylesheet" href="navbar.css" />
    <link rel="stylesheet" href="signup.css" />
    <link rel="stylesheet" href="toast.css" />
    <script src="config.js"></script>
    <style>
      html,
      body {
        width: 100%;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .page-container {
        width: 100%;
        overflow-x: hidden;
        box-sizing: border-box;
      }
      .search-box-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .search-box-wrapper i {
        position: absolute;
        left: 14px;
        color: #94a3b8;
        font-size: 14px;
        pointer-events: none;
      }
      .search-box-wrapper input {
        padding: 12px 16px 12px 38px;
        border-radius: 10px;
        border: 1px solid #e5d5d5;
        background: white;
        font-size: 14px;
        color: #1e1112;
        outline: none;
        width: 240px;
        font-family: inherit;
        transition: all 0.2s ease;
      }
      .search-box-wrapper input:focus {
        border-color: #ff6347;
        box-shadow: 0 0 0 3px rgba(255, 99, 71, 0.15);
        width: 280px;
      }
      .idea-tag-chip {
        display: inline-block;
        background: #f1f5f9;
        color: #475569;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 6px;
        margin-right: 6px;
        margin-top: 6px;
      }
      .cmt-input-group {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .cmt-input-group input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 13px;
        outline: none;
      }
      .cmt-input-group input:focus {
        border-color: #ff6347;
      }
      .cmt-input-group button {
        background: #ff6347;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .cmt-input-group button:hover {
        background: #e04e33;
      }
    </style>
  </head>
  <body>
    <div class="page-container">
      <div id="navbar"></div>

      <main class="explore-container">
        <header class="explore-header">
          <div class="header-left">
            <h2>Explore Creative <span class="green">Ideas</span></h2>
            <p>Discover innovative solutions pitched by creators worldwide.</p>
          </div>

          <div class="header-actions">
            <div class="search-box-wrapper">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                id="search-input"
                placeholder="Search ideas, topics, tags..."
              />
            </div>

            <select id="category-filter" class="filter-dropdown">
              <option value="all">All Categories</option>
              <option value="Technology">Technology</option>
              <option value="Science">Science</option>
              <option value="Art">Art</option>
              <option value="Business">Business</option>
              <option value="Other">Other</option>
            </select>
            
            <button
              id="share-idea-btn"
              class="btn-share"
              type="button"
            >
              <i class="fa-solid fa-plus"></i> Share Idea
            </button>
          </div>
        </header>

        <section class="ideas-grid" id="ideas-container">
          <div style="text-align: center; padding: 60px 20px; color: #64748b; width: 100%; grid-column: 1 / -1;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: #ff6347; margin-bottom: 12px;"></i>
            <p>Loading awesome ideas...</p>
          </div>
        </section>
      </main>
    </div>

   
    <div
      id="share-modal"
      class="modal-overlay"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      "
    >
      <div
        style="
          background: white;
          padding: 30px;
          border-radius: 16px;
          width: 90%;
          max-width: 520px;
          font-family: inherit;
          position: relative;
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
          max-height: 90vh;
          overflow-y: auto;
        "
      >
        <span
          id="close-share-btn"
          style="
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 26px;
            cursor: pointer;
            color: #94a3b8;
          "
          >&times;</span
        >

        <h2 style="margin: 0 0 6px 0; font-size: 22px; font-weight: 800;">
          Pitch Your Innovative <span style="color: #ff6347">Idea</span>
        </h2>
        <p style="margin: 0 0 20px 0; color: #64748b; font-size: 14px">
          Fill out the details below. It will be published under your profile.
        </p>

        <form id="popup-idea-form">
          <div style="margin-bottom: 15px">
            <label
              for="idea-title"
              style="
                font-weight: 600;
                font-size: 13px;
                display: block;
                margin-bottom: 6px;
                color: #334155;
              "
              >Idea Title</label
            >
            <input
              type="text"
              id="idea-title"
              placeholder="e.g., Smart AI Water Management System"
              maxlength="100"
              required
              style="
                width: 100%;
                padding: 10px 14px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                box-sizing: border-box;
                font-family: inherit;
              "
            />
          </div>

          <div style="margin-bottom: 15px">
            <label
              for="idea-cat"
              style="
                font-weight: 600;
                font-size: 13px;
                display: block;
                margin-bottom: 6px;
                color: #334155;
              "
              >Category</label
            >
            <select
              id="idea-cat"
              required
              style="
                width: 100%;
                padding: 10px 14px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                box-sizing: border-box;
                background: white;
                font-family: inherit;
              "
            >
              <option value="" disabled selected>Select a category</option>
              <option value="Technology">Technology</option>
              <option value="Science">Science</option>
              <option value="Art">Art</option>
              <option value="Business">Business</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div style="margin-bottom: 15px">
            <label
              for="idea-tags"
              style="
                font-weight: 600;
                font-size: 13px;
                display: block;
                margin-bottom: 6px;
                color: #334155;
              "
              >Tags
              <span style="color: #64748b; font-weight: normal; font-size: 12px"
                >(comma separated, e.g. #ai, #iot, #green)</span
              ></label
            >
            <input
              type="text"
              id="idea-tags"
              placeholder="ai, iot, smart-city"
              style="
                width: 100%;
                padding: 10px 14px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                box-sizing: border-box;
                font-family: inherit;
              "
            />
          </div>

          <div style="margin-bottom: 20px">
            <label
              for="idea-desc"
              style="
                font-weight: 600;
                font-size: 13px;
                display: block;
                margin-bottom: 6px;
                color: #334155;
              "
              >Description / Concept</label
            >
            <textarea
              id="idea-desc"
              rows="4"
              placeholder="Explain your idea, problem statement, and prospective impact..."
              required
              style="
                width: 100%;
                padding: 10px 14px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                resize: vertical;
                box-sizing: border-box;
                font-family: inherit;
              "
            ></textarea>
          </div>

          <div
            style="
              display: flex;
              gap: 12px;
              justify-content: flex-end;
              align-items: center;
            "
          >
            <button
              type="button"
              id="share-cancel"
              style="
                background: #f1f5f9;
                border: none;
                padding: 10px 20px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 600;
                color: #475569;
              "
            >
              Cancel
            </button>
            <button
              type="submit"
              id="share-submit-btn"
              style="
                background: #ff6347;
                color: white;
                border: none;
                padding: 10px 22px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 600;
                display: inline-flex;
                align-items: center;
                gap: 8px;
              "
            >
              <i class="fa-solid fa-paper-plane"></i> Publish Idea
            </button>
          </div>
        </form>
      </div>
    </div>

  
    <div
      id="edit-modal"
      class="modal-overlay"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      "
    >
      <div
        style="
          background: white;
          padding: 30px;
          border-radius: 16px;
          width: 90%;
          max-width: 500px;
          font-family: inherit;
          position: relative;
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        "
      >
        <span
          id="pop-close"
          style="
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 26px;
            cursor: pointer;
            color: #94a3b8;
          "
          >&times;</span
        >

        <h3 style="margin: 0 0 16px 0; color: #ff6347; font-size: 20px; font-weight: 800;">
          <i class="fa-regular fa-pen-to-square"></i> Edit Idea
        </h3>
        
        <div style="margin-bottom: 14px;">
          <label style="font-weight: 600; font-size: 13px; color: #334155; display: block; margin-bottom: 6px;">Title</label>
          <input type="text" id="pop-title" maxlength="100" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-family: inherit;">
        </div>

        <div style="margin-bottom: 14px;">
          <label style="font-weight: 600; font-size: 13px; color: #334155; display: block; margin-bottom: 6px;">Category</label>
          <select id="pop-cat" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-family: inherit; background: white;">
            <option value="Technology">Technology</option>
            <option value="Science">Science</option>
            <option value="Art">Art</option>
            <option value="Business">Business</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div style="margin-bottom: 14px;">
          <label style="font-weight: 600; font-size: 13px; color: #334155; display: block; margin-bottom: 6px;">Tags (comma separated)</label>
          <input type="text" id="pop-tags" placeholder="ai, iot, coding" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-family: inherit;">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="font-weight: 600; font-size: 13px; color: #334155; display: block; margin-bottom: 6px;">Description</label>
          <textarea id="pop-desc" rows="4" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; resize: vertical; box-sizing: border-box; font-family: inherit;"></textarea>
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button id="pop-cancel" style="background: #f1f5f9; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; color: #475569;">Cancel</button>
          <button id="pop-save" style="background: #ff6347; color: white; border: none; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-weight: 600;">Save Changes</button>
        </div>
      </div>
    </div>


    <div id="auth-modal" class="modal-overlay" style="display: none"></div>
    <div id="footer"></div>

    <script src="config.js"></script>
    <script src="toast.js"></script>
    <script src="signup.js"></script>
    <script src="login.js"></script>
    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script src="explore.js"></script>
  </body>
</html>
